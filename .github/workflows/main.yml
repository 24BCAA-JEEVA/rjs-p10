
name: React Practical 10

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Build React Project
        run: npm run build

      - name: Run Test Cases
        run: npm run testcase

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: autograding
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Build React Project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
